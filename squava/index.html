        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #eee;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px;
                text-align: center;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.2), 0 5px 5px 0 rgba(0, 0, 0, 0.24);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #f2f2f2;
                width: 100%;
                border: 0;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #F5623D;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #F5623D;
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #0B0D14;
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            /* HashDog look (hashdog.com): navy background, coral accent, Space Grotesk. */
            .staticrypt-html, .staticrypt-body { background: #0B0D14; }
            .staticrypt-content { font-family: "Space Grotesk", system-ui, sans-serif; color: #E7E9EF; }
            .staticrypt-page { width: min(400px, calc(100vw - 32px)); padding-top: 12vh; }
            .staticrypt-form {
                background: #0F121A; border: 1px solid #1F222E; border-radius: 16px;
                box-shadow: 0 0 40px rgba(245, 98, 61, 0.10), 0 16px 48px rgba(0, 0, 0, 0.4);
                padding: 36px 32px; text-align: left; max-width: none;
            }
            .staticrypt-instructions { margin: 0; }
            .staticrypt-brand { --accent: #F5623D; display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-weight: 700; letter-spacing: .02em; }
            .staticrypt-brand svg { width: 34px; height: 26px; color: #E7E9EF; }
            .staticrypt-title { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
            .staticrypt-instructions p:not(.staticrypt-title) { margin: 0; color: #8A93A6; font-size: 15px; line-height: 1.5; }
            .staticrypt-hr { border-top-color: #1F222E; }
            .staticrypt-password-container { background: #0B0D14; border: 1px solid #1F222E; border-radius: 12px; }
            .staticrypt-password-container:focus-within { border-color: #F5623D; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { color: #E7E9EF; font-family: "JetBrains Mono", ui-monospace, monospace; }
            .staticrypt-toggle-password-visibility { filter: invert(1); }
            .staticrypt-form .staticrypt-decrypt-button {
                border-radius: 999px; color: #0B0D14; font-family: "Space Grotesk", system-ui, sans-serif;
                font-weight: 700; letter-spacing: .04em;
            }
            label.staticrypt-remember { color: #8A93A6; font-size: 14px; }
            .staticrypt-remember input[type="checkbox"] { accent-color: #F5623D; transform: scale(1.2); margin-right: .7em; }
            .staticrypt-spinner { border-color: #F5623D; border-right-color: transparent; }
        </style>
